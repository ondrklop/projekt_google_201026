<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Advanced Search</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>

        <h1>Search using Google's Advanced Search:</h1>
        <form action="https://www.google.com/search" method="get" class="form">
    <label for="as_q">All these words:</label>
    <input type="text" id="as_q" name="as_q" placeholder="exact words..."> <br>

    <label for="as_epq">Exact phrase:</label>
    <input type="text" id="as_epq" name="as_epq" placeholder="exact phrase..."> <br>

    <label for="as_oq">Exact words:</label>
    <input type="text" id="as_oq" name="as_oq" placeholder="exact words..."> <br>

    <label for="as_eq">Without these words:</label>
    <input type="text" id="as_eq" name="as_eq" placeholder="excluded words..."> <br>

    <button type="submit">Google Advanced Search</button>
</form>
<br>

    </body>
    <button onclick="window.location.href='image.html'">Image Search</button> <button onclick="window.location.href='index.html'">Query Search</button>
</html>
